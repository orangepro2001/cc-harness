<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>CC Harness</title>
<base href="/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23d97757%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23fff%27%3E%E2%9C%BB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- login -->
<main id="login" hidden>
  <form id="login-form">
    <h1>CC Harness</h1>
    <p class="sub">常驻的 Claude Code 服务</p>
    <input id="login-user" autocomplete="username" placeholder="用户名" value="tony" required>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="密码" required>
    <button type="submit">登录</button>
    <p id="login-err" class="err"></p>
  </form>
</main>

<!-- app -->
<div id="app" hidden>
  <div id="scrim"></div>
  <aside id="side">
    <header>
      <b>CC Harness</b>
      <span id="who"></span>
      <button id="btn-logout" class="ghost" title="退出登录">退出</button>
    </header>
    <div class="side-acts">
      <button id="btn-new" class="primary">＋ 新建会话</button>
      <button id="btn-import" class="ghost" title="接管本机 Claude Code 里已有的会话">接管本机会话…</button>
    </div>
    <ul id="list"></ul>
    <section id="usage" hidden>
      <h2>用量 <small id="usage-plan"></small></h2>
      <div id="usage-bars"></div>
    </section>
  </aside>

  <section id="main">
    <header id="bar">
      <button id="btn-menu" class="ghost" title="会话列表" aria-label="会话列表">☰</button>
      <div class="heading">
        <div id="title"></div>
        <div id="meta"></div>
      </div>
      <span id="status" class="chip"></span>
      <select id="model" title="模型"></select>
      <select id="effort" title="推理强度 (effort)"></select>
      <select id="mode" title="权限模式"></select>
      <button id="btn-int" title="中断当前回合 (Esc)">中断</button>
      <button id="btn-stop" class="ghost" title="结束后台进程（会话可恢复）">停止进程</button>
      <button id="btn-del" class="ghost danger" title="删除会话">删除</button>
    </header>
    <div id="log"><div class="wrap" id="wrap"></div></div>
    <button id="jump" hidden>↓ 回到底部</button>
    <form id="composer">
      <ul id="slash" hidden></ul>
      <div class="cbox">
        <div id="atts" hidden></div>
        <div class="crow">
          <button type="button" id="btn-attach" title="添加图片或文件" aria-label="添加图片或文件">＋</button>
          <input type="file" id="file" multiple hidden>
          <textarea id="input" rows="1" placeholder="给 Claude 发消息…"></textarea>
          <button type="submit" class="primary" id="btn-send" title="发送 (Enter)" aria-label="发送">↑</button>
        </div>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · / 命令 · Esc 中断 · 可粘贴或拖入文件</div>
    </form>
    <div id="empty">
      <div class="logo">✻</div>
      <h2>CC Harness</h2>
      <p>选择左侧的会话，或新建一个开始</p>
      <button class="primary" id="btn-new2">＋ 新建会话</button>
    </div>
  </section>
</div>

<!-- new session dialog -->
<dialog id="dlg-new">
  <form method="dialog" id="new-form">
    <h3>新建会话</h3>
    <label>标题（可空）<input id="n-title" maxlength="100"></label>
    <label>工作目录
      <span class="row"><input id="n-cwd" placeholder="留空 = 个人工作区" autocomplete="off"><button type="button" id="n-pick">选择…</button></span>
    </label>
    <label>模型
      <select id="n-model"></select>
    </label>
    <label>推理强度 (effort)
      <select id="n-effort"></select>
    </label>
    <label>权限模式<select id="n-mode"></select></label>
    <p id="new-err" class="err"></p>
    <menu>
      <button value="cancel" type="button" id="n-cancel">取消</button>
      <button value="ok" type="submit" class="primary">创建</button>
    </menu>
  </form>
</dialog>

<!-- import local sessions -->
<dialog id="dlg-import">
  <h3>导入本地会话</h3>
  <p class="hint">接管本机 Claude Code 里已有的会话：沿用同一个会话 ID 继续对话（<code>--resume</code>）。请先在原处关闭它，避免两边同时写入。</p>
  <input id="i-filter" placeholder="筛选标题或目录" autocomplete="off">
  <ul id="i-list"></ul>
  <p id="i-err" class="err"></p>
  <menu><button type="button" id="i-close">关闭</button></menu>
</dialog>

<!-- directory picker -->
<dialog id="dlg-dir">
  <h3>选择工作目录</h3>
  <div id="d-path" class="crumbs"></div>
  <ul id="d-list"></ul>
  <p id="d-err" class="err"></p>
  <label class="chk"><input type="checkbox" id="d-hidden"> 显示隐藏目录</label>
  <menu>
    <button type="button" id="d-mk">新建文件夹</button>
    <button type="button" id="d-cancel">取消</button>
    <button type="button" id="d-ok" class="primary">选择此目录</button>
  </menu>
</dialog>

<script src="app.js"></script>
</body>
</html>
